services:
  demo:
    image: ${IMAGE:-jenkins-python-demo:local}
    container_name: jenkins-python-demo-staging
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
